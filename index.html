<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5SIM SMS Activator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: relative;
        }
        h2 { text-align: center; color: #007bff; margin-top: 0; font-size: 22px; }
        .card {
            background: #eef5ff;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #444; }
        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #dcdfe6;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            background-color: #fff;
        }
        select:disabled { background-color: #f2f2f2; cursor: not-allowed; }
        
        .btn-primary {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            font-size: 16px;
            transition: 0.2s;
        }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-primary:disabled { background-color: #a0cfff; cursor: not-allowed; }

        .order-box {
            background: #fff9e6;
            border: 1px solid #ffe58f;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Copyable Elements */
        .copyable-phone {
            font-size: 17px;
            color: #007bff;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            background: #eef5ff;
            display: inline-block;
            user-select: all;
        }
        .copyable-phone:hover {
            background: #d0e3ff;
        }

        /* Multiple SMS Container */
        .sms-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .sms-card {
            background: #e6f4ea;
            border: 1px solid #b7eb8f;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .sms-code {
            font-size: 26px;
            font-weight: bold;
            color: #28a745;
            letter-spacing: 3px;
            cursor: pointer;
            user-select: all;
            display: inline-block;
            padding: 4px 12px;
            background: #ffffff;
            border-radius: 6px;
            border: 1px dashed #28a745;
            margin-bottom: 5px;
        }
        .sms-code:hover {
            background: #f0fff4;
        }
        .sms-text {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
            word-break: break-word;
        }

        .loader { text-align: center; font-style: italic; color: #666; font-size: 13px; padding: 10px; }
        .badge {
            background: #007bff;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 5px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-cancel {
            background-color: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
        }
        .btn-cancel:hover { background-color: #bd2130; }

        .btn-change {
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            flex: 1;
        }
        .btn-change:hover { background-color: #117a8b; }

        /* Toast Popup Notice */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>5SIM SMS Activator</h2>

    <!-- Balance Card -->
    <div class="card">
        <span><strong>Balance:</strong></span>
        <span id="balance-display" style="font-size: 18px; font-weight: bold; color: #28a745;">Loading...</span>
    </div>

    <!-- Dropdown Form -->
    <div class="form-group">
        <label for="country-select">1. Select Country:</label>
        <select id="country-select" onchange="onCountryChange()">
            <option value="">-- Loading Countries... --</option>
        </select>
    </div>

    <div class="form-group">
        <label for="service-select">2. Select Service:</label>
        <select id="service-select" disabled onchange="onServiceChange()">
            <option value="">-- Select Country First --</option>
        </select>
    </div>

    <div class="form-group">
        <label for="operator-select">3. Select Operator:</label>
        <select id="operator-select" disabled>
            <option value="">-- Select Service First --</option>
        </select>
    </div>

    <button id="buy-btn" class="btn-primary" onclick="buyNumber()" disabled>Buy Virtual Number</button>

    <!-- Order Details -->
    <div id="order-section" class="order-box" style="display: none;">
        <h3 style="margin-top:0; font-size:16px;">Active Order</h3>
        <p style="margin:5px 0;">
            <strong>Phone:</strong> 
            <span id="phone-number" class="copyable-phone" onclick="copyToClipboard(this.innerText, 'Phone number copied!')">-</span>
            <small style="color: #888; font-size: 11px;">(click to copy)</small>
        </p>
        <p style="margin:5px 0;"><strong>Order ID:</strong> <span id="order-id">-</span></p>
        <p style="margin:5px 0;"><strong>Status:</strong> <span id="order-status" class="badge">WAITING</span></p>

        <hr style="border:0; border-top:1px dashed #ccc; margin:10px 0;">
        
        <!-- All SMS Codes will be listed here -->
        <div id="sms-container">
            <div class="loader">Waiting for SMS code...</div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons" id="action-buttons">
            <button class="btn-cancel" id="btn-cancel-id" onclick="cancelNumber()">Cancel Order</button>
            <button class="btn-change" id="btn-change-id" onclick="changeNumber()">Change Number</button>
        </div>
    </div>
</div>

<!-- Copy Toast Notification -->
<div id="toast" class="toast">Copied!</div>

<script>
    const BACKEND_URL = "https://underuse-fading-math.ngrok-free.dev";
    const headers = { "ngrok-skip-browser-warning": "69420" };

    let servicesData = [];
    let currentOrderId = null;
    let pollingInterval = null;
    let rawPhoneNumber = "";

    const serviceIcons = {
        'telegram': '✈️', 'whatsapp': '💬', 'steam': '🎮', 'google': '🔍',
        'youtube': '▶️', 'facebook': '📘', 'instagram': '📷', 'twitter': '🐦',
        'x': '🐦', 'tiktok': '🎵', 'discord': '👾', 'openai': '🤖',
        'chatgpt': '🤖', 'netflix': '🎬', 'amazon': '🛒', 'apple': '🍏'
    };

    function getCountryFlag(countryCode) {
        if (!countryCode || countryCode.length !== 2) return '🌐';
        const codePoints = countryCode
            .toUpperCase()
            .split('')
            .map(char => 127397 + char.charCodeAt());
        return String.fromCodePoint(...codePoints);
    }

    function getServiceIcon(serviceName) {
        const name = serviceName.toLowerCase();
        for (const key in serviceIcons) {
            if (name.includes(key)) return serviceIcons[key];
        }
        return '📱';
    }

    // Helper: Copy to Clipboard Function
    function copyToClipboard(text, message = "Copied to clipboard!") {
        if (!text || text === "-") return;
        
        // Clean up text if it has extra spacing
        const cleanText = text.trim();

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(cleanText).then(() => showToast(message));
        } else {
            // Fallback for non-https/older browsers
            const textArea = document.createElement("textarea");
            textArea.value = cleanText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast(message);
        }
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.style.display = "block";
        setTimeout(() => {
            toast.style.display = "none";
        }, 2000);
    }

    async function init() {
        fetchBalance();
        fetchCountries();
    }

    async function fetchBalance() {
        try {
            const res = await fetch(`${BACKEND_URL}/api/profile`, { headers });
            const data = await res.json();
            document.getElementById("balance-display").innerText = data.balance !== undefined ? `$${parseFloat(data.balance).toFixed(4)}` : "Error";
        } catch {
            document.getElementById("balance-display").innerText = "Offline";
        }
    }

    async function fetchCountries() {
        const countrySelect = document.getElementById("country-select");
        try {
            const res = await fetch(`${BACKEND_URL}/api/countries`, { headers });
            const countries = await res.json();
            
            countrySelect.innerHTML = '<option value="">-- Choose a Country --</option>';
            const sortedKeys = Object.keys(countries).sort();
            
            sortedKeys.forEach(key => {
                const name = countries[key].text || key;
                const flag = countries[key].iso ? getCountryFlag(countries[key].iso) : '🌐';
                const opt = document.createElement("option");
                opt.value = key;
                opt.innerText = `${flag}  ${name}`;
                countrySelect.appendChild(opt);
            });
        } catch (e) {
            countrySelect.innerHTML = '<option value="">Failed to load countries</option>';
        }
    }

    async function onCountryChange() {
        const country = document.getElementById("country-select").value;
        const serviceSelect = document.getElementById("service-select");
        const operatorSelect = document.getElementById("operator-select");
        const buyBtn = document.getElementById("buy-btn");

        serviceSelect.disabled = true;
        operatorSelect.disabled = true;
        buyBtn.disabled = true;

        if (!country) return;

        serviceSelect.innerHTML = '<option value="">Loading Services & Prices...</option>';

        try {
            const res = await fetch(`${BACKEND_URL}/api/prices/${country}`, { headers });
            const data = await res.json();
            servicesData = data.services || [];

            if (servicesData.length === 0) {
                serviceSelect.innerHTML = '<option value="">No services available</option>';
                return;
            }

            serviceSelect.innerHTML = '<option value="">-- Choose Service --</option>';
            servicesData.forEach(item => {
                const icon = getServiceIcon(item.service);
                const opt = document.createElement("option");
                opt.value = item.service;
                opt.innerText = `${icon}  ${item.service.toUpperCase()} ($${item.price_usd} - ${item.count} pcs)`;
                serviceSelect.appendChild(opt);
            });

            serviceSelect.disabled = false;
        } catch {
            serviceSelect.innerHTML = '<option value="">Error loading services</option>';
        }
    }

    function onServiceChange() {
        const selectedService = document.getElementById("service-select").value;
        const operatorSelect = document.getElementById("operator-select");
        const buyBtn = document.getElementById("buy-btn");

        operatorSelect.disabled = true;
        buyBtn.disabled = true;

        if (!selectedService) return;

        const serviceInfo = servicesData.find(s => s.service === selectedService);
        if (!serviceInfo) return;

        operatorSelect.innerHTML = '<option value="any">📶 ANY OPERATOR (Best Chance)</option>';
        serviceInfo.operators.forEach(op => {
            if (op.count > 0) {
                const opt = document.createElement("option");
                opt.value = op.operator;
                opt.innerText = `📡  ${op.operator.toUpperCase()} ($${op.cost} - ${op.count} pcs)`;
                operatorSelect.appendChild(opt);
            }
        });

        operatorSelect.disabled = false;
        buyBtn.disabled = false;
    }

    async function buyNumber() {
        const country = document.getElementById("country-select").value;
        const service = document.getElementById("service-select").value;
        const operator = document.getElementById("operator-select").value || "any";

        document.getElementById("order-section").style.display = "block";
        document.getElementById("action-buttons").style.display = "flex";
        document.getElementById("phone-number").innerText = "Purchasing...";
        document.getElementById("order-id").innerText = "-";
        document.getElementById("order-status").innerText = "PROCESSING";
        
        document.getElementById("sms-container").innerHTML = '<div class="loader">Waiting for SMS code...</div>';

        if (pollingInterval) clearInterval(pollingInterval);

        try {
            const res = await fetch(`${BACKEND_URL}/api/buy/${country}/${operator}/${service}`, { headers });
            const data = await res.json();

            if (data.id && data.phone) {
                currentOrderId = data.id;
                rawPhoneNumber = data.phone;
                document.getElementById("phone-number").innerText = data.phone;
                document.getElementById("order-id").innerText = data.id;
                document.getElementById("order-status").innerText = data.status || "WAITING";

                fetchBalance();

                // Start polling every 3 seconds
                pollingInterval = setInterval(() => checkSMS(data.id), 3000);
            } else {
                document.getElementById("order-section").style.display = "none";
            }
        } catch (e) {
            document.getElementById("order-section").style.display = "none";
        }
    }

    // Checking for All SMS Codes (Support Multiple SMS)
    async function checkSMS(orderId) {
        try {
            const res = await fetch(`${BACKEND_URL}/api/check/${orderId}`, { headers });
            const data = await res.json();

            document.getElementById("order-status").innerText = data.status || "WAITING";

            if (data.sms && data.sms.length > 0) {
                const container = document.getElementById("sms-container");
                let listHtml = '<div class="sms-list">';

                // Reverse loop so newest SMS appears at the top
                const reversedSMS = [...data.sms].reverse();

                reversedSMS.forEach((smsItem, index) => {
                    const code = smsItem.code || smsItem.code_from_sms || "NO CODE";
                    const text = smsItem.text || smsItem.sender || "";

                    listHtml += `
                        <div class="sms-card">
                            <small style="color:#666; font-size:11px;">SMS #${data.sms.length - index}</small><br>
                            <div class="sms-code" onclick="copyToClipboard('${code}', 'OTP Code copied!')">
                                ${code}
                            </div>
                            <br><small style="color:#888; font-size:11px;">(click code to copy)</small>
                            ${text ? `<div class="sms-text">${text}</div>` : ''}
                        </div>
                    `;
                });

                listHtml += '</div>';
                container.innerHTML = listHtml;
            }

            if (data.status === "FINISHED" || data.status === "CANCELED" || data.status === "TIMEOUT") {
                clearInterval(pollingInterval);
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function cancelNumber() {
        if (!currentOrderId) return;

        try {
            const res = await fetch(`${BACKEND_URL}/api/cancel/${currentOrderId}`, { headers });
            const data = await res.json();

            if (data.status === "CANCELED" || data.id) {
                if (pollingInterval) clearInterval(pollingInterval);
                document.getElementById("order-section").style.display = "none";
                fetchBalance();
            }
        } catch (e) {
            console.error("Cancel failed", e);
        }
    }

    async function changeNumber() {
        if (!currentOrderId) return;

        try {
            await fetch(`${BACKEND_URL}/api/cancel/${currentOrderId}`, { headers });
            if (pollingInterval) clearInterval(pollingInterval);

            await buyNumber();
        } catch (e) {
            console.error("Change failed", e);
        }
    }

    window.onload = init;
</script>

</body>
</html>
