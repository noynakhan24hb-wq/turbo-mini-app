<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5SIM MINI APP</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(13, 22, 45, 0.7);
            --card-border: rgba(0, 140, 255, 0.3);
            --primary-blue: #00d2ff;
            --neon-blue: #0088ff;
            --neon-purple: #9d4edd;
            --neon-green: #00ff88;
            --neon-gold: #ffb703;
            --text-main: #ffffff;
            --text-muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 136, 255, 0.15), transparent 70%),
                radial-gradient(circle at 100% 100%, rgba(157, 78, 221, 0.1), transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 16px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 20px 0;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        .brand-logo {
            text-align: center;
        }

        .brand-logo h1 {
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #00ffff, #0088ff, #a100ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            line-height: 1;
        }

        .brand-logo span {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
            display: block;
            margin-top: 2px;
        }

        .profile-avatar {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid var(--primary-blue);
            overflow: visible;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background-color: var(--neon-green);
            border: 2px solid var(--bg-color);
            border-radius: 50%;
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, rgba(8, 26, 60, 0.8), rgba(6, 15, 38, 0.9));
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 136, 255, 0.15);
            margin-bottom: 16px;
        }

        .balance-title {
            font-size: 12px;
            color: var(--primary-blue);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-amount {
            font-size: 38px;
            font-weight: 800;
            color: var(--primary-blue);
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .id-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .copy-icon {
            cursor: pointer;
            width: 14px;
            height: 14px;
            stroke: var(--text-muted);
        }

        .wallet-graphic {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 90px;
            height: 90px;
            opacity: 0.85;
            pointer-events: none;
        }

        .btn-add-balance {
            position: absolute;
            bottom: 18px;
            right: 18px;
            background: rgba(0, 136, 255, 0.15);
            border: 1px solid var(--primary-blue);
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .btn-add-balance:active {
            transform: scale(0.95);
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px 8px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .stat-col {
            text-align: center;
            position: relative;
            padding: 0 4px;
        }

        .stat-col:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 10%;
            height: 80%;
            width: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            margin: 0 auto 10px auto;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-otp {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: var(--neon-green);
        }

        .icon-cost {
            background: rgba(255, 183, 3, 0.1);
            border: 1px solid rgba(255, 183, 3, 0.3);
            color: var(--neon-gold);
        }

        .icon-repeat {
            background: rgba(157, 78, 221, 0.1);
            border: 1px solid rgba(157, 78, 221, 0.3);
            color: var(--neon-purple);
        }

        .stat-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .val-otp { color: var(--neon-green); }
        .val-cost { color: var(--neon-gold); }
        .val-repeat { color: var(--neon-purple); }

        .view-details {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
        }

        /* Action Cards Section */
        .action-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .action-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 130px;
            cursor: pointer;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }

        .action-card:active {
            transform: scale(0.98);
        }

        .card-get-number {
            border-color: rgba(0, 136, 255, 0.4);
        }

        .card-active-order {
            border-color: rgba(157, 78, 221, 0.4);
            background: linear-gradient(135deg, rgba(20, 10, 40, 0.7), rgba(10, 15, 35, 0.8));
        }

        .action-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .action-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-sim {
            background: rgba(0, 136, 255, 0.15);
            border: 1px solid rgba(0, 136, 255, 0.4);
            color: var(--primary-blue);
        }

        .icon-clipboard {
            background: rgba(157, 78, 221, 0.15);
            border: 1px solid rgba(157, 78, 221, 0.4);
            color: var(--neon-purple);
        }

        .action-card-body h3 {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .action-card-body p {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .arrow-btn {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-blue {
            background: #0076ff;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 118, 255, 0.5);
        }

        .arrow-purple {
            background: #8b2fc9;
            color: #fff;
            box-shadow: 0 0 10px rgba(139, 47, 201, 0.5);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 416px;
            background: rgba(8, 15, 30, 0.9);
            border: 1px solid rgba(0, 140, 255, 0.25);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            position: relative;
            width: 25%;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary-blue);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -10px;
            width: 24px;
            height: 3px;
            background: var(--primary-blue);
            border-radius: 3px;
            box-shadow: 0 0 8px var(--primary-blue);
        }

        .nav-icon {
            width: 22px;
            height: 22px;
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: 22%;
            background: #ff2a5f;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 10px;
            border: 2px solid var(--bg-color);
        }

        .sub-text {
            font-size: 8px;
            color: var(--text-muted);
            margin-top: -2px;
        }

        /* Toast Popup Notice */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 210, 255, 0.9);
            color: #000;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Header -->
    <div class="top-bar">
        <button class="menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="brand-logo">
            <h1>5SIM</h1>
            <span>MINI APP</span>
        </div>

        <div class="profile-avatar">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=5simApp" alt="User Avatar">
            <div class="online-dot"></div>
        </div>
    </div>

    <!-- 1. Your Balance Card -->
    <div class="balance-card">
        <div class="balance-title">
            1. YOUR BALANCE
        </div>
        
        <!-- ID preserved for API: balance-display -->
        <div class="balance-amount" id="balance-display">$ 12.45</div>

        <div class="id-row">
            <span>ID: <span id="user-id">1234567890</span></span>
            <svg class="copy-icon" onclick="copyToClipboard('1234567890', 'ID Copied!')" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
        </div>

        <!-- Wallet Neon SVG Graphic -->
        <svg class="wallet-graphic" viewBox="0 0 100 100" fill="none">
            <path d="M20 35C20 29.4772 24.4772 25 30 25H80C85.5228 25 90 29.4772 90 35V75C90 80.5228 85.5228 85 80 85H30C24.4772 85 20 80.5228 20 75V35Z" fill="url(#paint0_linear)" stroke="#0088ff" stroke-width="2"/>
            <path d="M65 50C65 44.4772 69.4772 40 75 40H90V65H75C69.4772 65 65 60.5228 65 55V50Z" fill="#060f26" stroke="#00d2ff" stroke-width="2"/>
            <circle cx="77.5" cy="52.5" r="4.5" fill="#00d2ff"/>
            <defs>
                <linearGradient id="paint0_linear" x1="20" y1="25" x2="90" y2="85" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#0055ff" stop-opacity="0.8"/>
                    <stop offset="1" stop-color="#050b1a" stop-opacity="0.9"/>
                </linearGradient>
            </defs>
        </svg>

        <button class="btn-add-balance" onclick="addBalance()">
            <span>+</span> Add Balance
        </button>
    </div>

    <!-- Stats Section (Today OTP / Today Cost / Total Repeat OTP) -->
    <div class="stats-grid">
        <div class="stat-col">
            <div class="stat-icon icon-otp">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    <circle cx="8" cy="10" r="1" fill="currentColor"></circle>
                    <circle cx="12" cy="10" r="1" fill="currentColor"></circle>
                    <circle cx="16" cy="10" r="1" fill="currentColor"></circle>
                </svg>
            </div>
            <div class="stat-label">TODAY OTP</div>
            <!-- ID preserved for API: today-otp -->
            <div class="stat-value val-otp" id="today-otp">36</div>
            <div class="view-details" onclick="openDetails('otp')">
                View Details
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </div>

        <div class="stat-col">
            <div class="stat-icon icon-cost">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <div class="stat-label">TODAY COST</div>
            <!-- ID preserved for API: today-cost -->
            <div class="stat-value val-cost" id="today-cost">$4.12</div>
            <div class="view-details" onclick="openDetails('cost')">
                View Details
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </div>

        <div class="stat-col">
            <div class="stat-icon icon-repeat">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
            </div>
            <div class="stat-label">TOTAL REPEAT OTP</div>
            <!-- ID preserved for API: repeat-otp -->
            <div class="stat-value val-repeat" id="repeat-otp">12</div>
            <div class="view-details" onclick="openDetails('repeat')">
                View Details
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </div>
    </div>

    <!-- Action Cards Section -->
    <div class="action-cards">
        <div class="action-card card-get-number" onclick="goToGetNumber()">
            <div class="action-card-header">
                <div class="action-icon icon-sim">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="4" y="2" width="16" height="20" rx="3" ry="3"></rect>
                        <line x1="8" y1="6" x2="12" y2="6"></line>
                        <line x1="8" y1="10" x2="16" y2="10"></line>
                        <line x1="8" y1="14" x2="16" y2="14"></line>
                    </svg>
                </div>
            </div>
            <div class="action-card-body">
                <h3>GET NUMBER</h3>
                <p>Get a new number<br>from any service</p>
            </div>
            <div class="arrow-btn arrow-blue">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </div>

        <div class="action-card card-active-order" onclick="goToActiveOrders()">
            <div class="action-card-header">
                <div class="action-icon icon-clipboard">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        <circle cx="9" cy="11" r="1" fill="currentColor"></circle>
                        <line x1="13" y1="11" x2="17" y2="11" stroke-width="2"></line>
                        <circle cx="9" cy="16" r="1" fill="currentColor"></circle>
                        <line x1="13" y1="16" x2="17" y2="16" stroke-width="2"></line>
                    </svg>
                </div>
            </div>
            <div class="action-card-body">
                <h3>ACTIVE ORDER</h3>
                <p>View your<br>active orders</p>
            </div>
            <div class="arrow-btn arrow-purple">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
    <a class="nav-item active" onclick="switchNav('home')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>Home</span>
    </a>

    <a class="nav-item" onclick="switchNav('inbox')">
        <span class="badge-count" id="inbox-badge">36</span>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <span>Inbox</span>
        <span class="sub-text">( Total OTP Messages )</span>
    </a>

    <a class="nav-item" onclick="switchNav('profile')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
    </a>

    <a class="nav-item" onclick="switchNav('orders')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="4" width="14" height="16" rx="2"></rect>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="9" y1="12" x2="15" y2="12"></line>
            <line x1="9" y1="16" x2="13" y2="16"></line>
        </svg>
        <span>Orders</span>
    </a>
</div>

<!-- Toast Popup -->
<div id="toast" class="toast">Copied!</div>

<script>
    // Copy Helper
    function copyToClipboard(text, msg) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => showToast(msg));
        } else {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast(msg);
        }
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2000);
    }

    // Interactive Functions for UI Navigation
    function addBalance() {
        showToast("Opening Add Balance...");
    }

    function openDetails(type) {
        showToast("Viewing " + type + " details");
    }

    function goToGetNumber() {
        showToast("Loading Get Number...");
    }

    function goToActiveOrders() {
        showToast("Loading Active Orders...");
    }

    function switchNav(page) {
        showToast("Navigated to " + page.toUpperCase());
    }
</script>

</body>
</html>
