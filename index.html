<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5SIM Virtual Number Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #007bff; margin-bottom: 20px; }
        .card {
            background: #eef5ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .order-box {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .sms-code {
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
            text-align: center;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        .loader { text-align: center; font-style: italic; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>5SIM SMS Activator</h2>

    <!-- 1. Balance Section -->
    <div class="card">
        <span><strong>Account Balance:</strong></span>
        <span id="balance-display" style="font-size: 18px; font-weight: bold; color: #28a745;">Loading...</span>
    </div>

    <!-- 2. Purchase Form -->
    <div class="form-group">
        <label for="country">Country:</label>
        <input type="text" id="country" value="russia" placeholder="e.g. russia, england, usa">
    </div>

    <div class="form-group">
        <label for="operator">Operator:</label>
        <input type="text" id="operator" value="any" placeholder="e.g. any, megafon, tele2">
    </div>

    <div class="form-group">
        <label for="service">Service:</label>
        <input type="text" id="service" value="telegram" placeholder="e.g. telegram, whatsapp, steam">
    </div>

    <button onclick="buyNumber()">Buy Virtual Number</button>

    <!-- 3. Active Order & SMS Panel -->
    <div id="order-section" class="order-box" style="display: none;">
        <h3>Active Number</h3>
        <p><strong>Phone Number:</strong> <span id="phone-number">-</span></p>
        <p><strong>Order ID:</strong> <span id="order-id">-</span></p>
        <p><strong>Status:</strong> <span id="order-status">PENDING</span></p>

        <hr>
        <h4>Received SMS:</h4>
        <div id="sms-container" class="loader">Waiting for SMS code...</div>
    </div>
</div>

<script>
    // 🔗 আপনার Ngrok Backend URL এখানে আপডেট করুন
    const BACKEND_URL = "https://underuse-fading-math.ngrok-free.dev";

    // Ngrok Warning Bypass এর জন্য সাধারণ Headers
    const customHeaders = {
        "ngrok-skip-browser-warning": "69420",
        "Content-Type": "application/json"
    };

    let pollingInterval = null;

    // 1. Fetch & Display Balance
    async function loadBalance() {
        try {
            const response = await fetch(`${BACKEND_URL}/api/profile`, { headers: customHeaders });
            const data = await response.json();
            
            if (data.balance !== undefined) {
                document.getElementById("balance-display").innerText = `$${data.balance.toFixed(4)}`;
            } else {
                document.getElementById("balance-display").innerText = "Error";
            }
        } catch (error) {
            console.error("Balance fetch error:", error);
            document.getElementById("balance-display").innerText = "Connection Failed";
        }
    }

    // 2. Buy Number Function
    async function buyNumber() {
        const country = document.getElementById("country").value.trim().toLowerCase();
        const operator = document.getElementById("operator").value.trim().toLowerCase();
        const service = document.getElementById("service").value.trim().toLowerCase();

        if (!country || !operator || !service) {
            alert("Please fill in all fields!");
            return;
        }

        document.getElementById("order-section").style.display = "block";
        document.getElementById("phone-number").innerText = "Purchasing...";
        document.getElementById("order-id").innerText = "-";
        document.getElementById("order-status").innerText = "PROCESSING";
        document.getElementById("sms-container").className = "loader";
        document.getElementById("sms-container").innerText = "Waiting for SMS code...";

        // আগের কোনো চেকিং বন্ধ করা
        if (pollingInterval) clearInterval(pollingInterval);

        try {
            const response = await fetch(`${BACKEND_URL}/api/buy/${country}/${operator}/${service}`, { headers: customHeaders });
            const data = await response.json();

            if (data.id && data.phone) {
                document.getElementById("phone-number").innerText = data.phone;
                document.getElementById("order-id").innerText = data.id;
                document.getElementById("order-status").innerText = data.status || "WAITING FOR SMS";

                // ব্যালেন্স আপডেট করা
                loadBalance();

                // প্রতি ৫ সেকেন্ড পর পর SMS চেক চালু করা
                pollingInterval = setInterval(() => {
                    checkSMS(data.id);
                }, 5000);

            } else {
                alert("Failed to buy number: " + (data.error || JSON.stringify(data)));
                document.getElementById("order-section").style.display = "none";
            }
        } catch (error) {
            console.error("Buy number error:", error);
            alert("Error connecting to backend server.");
            document.getElementById("order-section").style.display = "none";
        }
    }

    // 3. Auto Check SMS Status Function
    async function checkSMS(orderId) {
        try {
            const response = await fetch(`${BACKEND_URL}/api/check/${orderId}`, { headers: customHeaders });
            const data = await response.json();

            document.getElementById("order-status").innerText = data.status || "WAITING";

            // SMS রিসিভ হলে
            if (data.sms && data.sms.length > 0) {
                const latestSMS = data.sms[data.sms.length - 1];
                const smsContainer = document.getElementById("sms-container");
                smsContainer.className = "sms-code";
                smsContainer.innerText = `Code: ${latestSMS.code} (Full SMS: ${latestSMS.text})`;

                // SMS পেয়ে গেলে অটো-চেক থামানো
                clearInterval(pollingInterval);
            } else if (data.status === "FINISHED" || data.status === "CANCELED") {
                clearInterval(pollingInterval);
            }
        } catch (error) {
            console.error("SMS check error:", error);
        }
    }

    // পেজ লোড হওয়ার সাথে সাথে ব্যালেন্স লোড হবে
    window.onload = loadBalance;
</script>

</body>
</html>
