<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Number - Country List UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #080711;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* App Screen Card Container */
    .app-card {
      width: 100%;
      max-width: 420px;
      background-color: #0d0c1d;
      border: 1px solid #1f1b3e;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Primary Action Button (Get Number) */
    .main-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6322db, #4312a0);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .main-btn:hover {
      background: linear-gradient(135deg, #7433ee, #5118be);
      box-shadow: 0 0 15px rgba(99, 34, 219, 0.4);
    }

    /* Hidden State for Country Section */
    .hidden {
      display: none !important;
    }

    /* Section Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-globe {
      width: 40px;
      height: 40px;
      background-color: #1c154c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7b46f6;
      font-size: 20px;
    }

    .title-area h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .title-area p {
      font-size: 12px;
      color: #8c88ad;
    }

    .sort-dropdown {
      background-color: #171233;
      border: 1px solid #2b2354;
      color: #d1ccf0;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Search Input Box */
    .search-box {
      position: relative;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background-color: #120e29;
      border: 1px solid #32256a;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-box input::placeholder {
      color: #69628a;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #69628a;
    }

    /* Country Scrollable List */
    .country-list {
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    /* Custom Scrollbar Styling */
    .country-list::-webkit-scrollbar {
      width: 5px;
    }
    .country-list::-webkit-scrollbar-thumb {
      background: #251e4b;
      border-radius: 4px;
    }

    /* Individual Country Row */
    .country-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      background-color: transparent;
      cursor: pointer;
      transition: background 0.2s;
    }

    .country-item:hover, .country-item.selected {
      background-color: #181238;
    }

    .country-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flag {
      font-size: 22px;
      width: 32px;
      text-align: center;
    }

    .country-name {
      font-size: 14px;
      font-weight: 500;
    }

    .dial-code {
      font-size: 13px;
      color: #8c88ad;
      margin-left: 8px;
    }

    .country-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .service-badge {
      background-color: #1c1543;
      color: #a272ff;
      border: 1px solid #2d2263;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
    }

    .arrow {
      color: #69628a;
      font-size: 14px;
    }

    /* Next Button at Bottom */
    .next-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #571cd8, #4210a5);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="app-card">

    <!-- Step 1: Initial "Get Number" Button -->
    <button id="getNumberBtn" class="main-btn">
      Get Number ⚡
    </button>

    <!-- Step 2: Country Selection Area (Hidden initially) -->
    <div id="countrySection" class="hidden">
      
      <!-- Header -->
      <div class="section-header">
        <div class="header-left">
          <div class="icon-globe">🌐</div>
          <div class="title-area">
            <h3>2. Select Country</h3>
            <p>Choose a country to continue</p>
          </div>
        </div>
        <select class="sort-dropdown">
          <option>By Popularity</option>
          <option>By Name</option>
        </select>
      </div>

      <!-- Search Field -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search country...">
      </div>

      <!-- Country List Container -->
      <div class="country-list" id="countryList">
        
        <div class="country-item" data-name="United States">
          <div class="country-info">
            <span class="flag">🇺🇸</span>
            <span class="country-name">United States</span>
            <span class="dial-code">+1</span>
          </div>
          <div class="country-meta">
            <span class="service-badge">152 Services</span>
            <span class="arrow">❯</span>
          </div>
        </div>

        <div class="country-item" data-name="United Kingdom">
          <div class="country-info">
            <span class="flag">🇬🇧</span>
            <span class="country-name">United Kingdom</span>
            <span class="dial-code">+44</span>
          </div>
          <div class="country-meta">
            <span class="service-badge">98 Services</span>
            <span class="arrow">❯</span>
          </div>
        </div>

        <div class="country-item" data-name="India">
          <div class="country-info">
            <span class="flag">🇮🇳</span>
            <span class="country-name">India</span>
            <span class="dial-code">+91</span>
          </div>
          <div class="country-meta">
            <span class="service-badge">121 Services</span>
            <span class="arrow">❯</span>
          </div>
        </div>

        <div class="country-item" data-name="Indonesia">
          <div class="country-info">
            <span class="flag">🇮🇩</span>
            <span class="country-name">Indonesia</span>
            <span class="dial-code">+62</span>
          </div>
          <div class="country-meta">
            <span class="service-badge">87 Services</span>
            <span class="arrow">❯</span>
          </div>
        </div>

        <div class="country-item" data-name="Germany">
          <div class="country-info">
            <span class="flag">🇩🇪</span>
            <span class="country-name">Germany</span>
            <span class="dial-code">+49</span>
          </div>
          <div class="country-meta">
            <span class="service-badge">76 Services</span>
            <span class="arrow">❯</span>
          </div>
        </div>

        <div class="country-item" data-name="France">
          <div class="country-info">
            <span class="flag">🇫🇷</span>
            <span class="country-name">France</span>
            <span class="dial-code">+33</span>
          </div>
          <div class="country-meta">
            <span class="service-badge">95 Services</span>
            <span class="arrow">❯</span>
          </div>
        </div>

        <div class="country-item" data-name="Bangladesh">
          <div class="country-info">
            <span class="flag">🇧🇩</span>
            <span class="country-name">Bangladesh</span>
            <span class="dial-code">+880</span>
          </div>
          <div class="country-meta">
            <span class="service-badge">46 Services</span>
            <span class="arrow">❯</span>
          </div>
        </div>

      </div>

      <!-- Bottom Next Button -->
      <button class="next-btn" id="nextBtn">
        Next ❯
      </button>

    </div>

  </div>

  <script>
    const getNumberBtn = document.getElementById('getNumberBtn');
    const countrySection = document.getElementById('countrySection');
    const searchInput = document.getElementById('searchInput');
    const countryItems = document.querySelectorAll('.country-item');

    // 1. Link "Get Number" button to display Country List
    getNumberBtn.addEventListener('click', () => {
      getNumberBtn.classList.add('hidden'); // Hide "Get Number" button
      countrySection.classList.remove('hidden'); // Show Country Selection UI
    });

    // 2. Real-time Search functionality
    searchInput.addEventListener('input', (e) => {
      const filter = e.target.value.toLowerCase();
      countryItems.forEach(item => {
        const name = item.getAttribute('data-name').toLowerCase();
        if (name.includes(filter)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    });

    // 3. Selection visual highlight
    countryItems.forEach(item => {
      item.addEventListener('click', () => {
        countryItems.forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');
      });
    });
  </script>
</body>
</html>
