<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5SIM SMS Activator Mini App</title>
    <style>
        :root {
            --primary-color: #007aff;
            --primary-hover: #0056b3;
            --bg-color: #f2f4f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --text-muted: #8e8e93;
            --success-color: #34c759;
            --danger-color: #ff3b30;
            --warning-color: #ff9500;
            --border-radius: 14px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 12px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
        }

        .mini-app {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white;
            padding: 16px;
            border-radius: var(--border-radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
        }

        .balance-title {
            font-size: 13px;
            opacity: 0.9;
        }

        .balance-amount {
            font-size: 22px;
            font-weight: 700;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #e5e5ea;
            background-color: #f9f9fb;
            font-size: 15px;
            color: var(--text-color);
            outline: none;
            transition: all 0.2s ease;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%238e8e93" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
        }

        select:focus {
            border-color: var(--primary-color);
            background-color: #fff;
        }

        select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Main Buy Button */
        .btn-buy {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.15);
        }

        .btn-buy:active {
            transform: scale(0.98);
        }

        .btn-buy:disabled {
            background-color: #c7c7cc;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Active Order Box */
        .order-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: var(--border-radius);
            padding: 16px;
            margin-top: 20px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #dee2e6;
        }

        .order-title {
            font-size: 14px;
            font-weight: 700;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-waiting { background: #fff3cd; color: #856404; }
        .badge-received { background: #d4edda; color: #155724; }
        .badge-canceled { background: #f8d7da; color: #721c24; }

        .phone-box {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .phone-box:hover {
            border-color: var(--primary-color);
        }

        .phone-number {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 0.5px;
        }

        .copy-hint {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* SMS List */
        .sms-container {
            margin-top: 10px;
        }

        .sms-card {
            background: #eafaf1;
            border: 1px solid #2ecc71;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
        }

        .sms-code {
            font-size: 26px;
            font-weight: 800;
            color: #27ae60;
            letter-spacing: 3px;
            background: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            display: inline-block;
            border: 1px dashed #27ae60;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .sms-text {
            font-size: 12px;
            color: #555;
            word-break: break-word;
        }

        .loader-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            padding: 10px 0;
        }

        /* Action Buttons */
        .action-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-cancel { background: #ffe5e5; color: var(--danger-color); }
        .btn-cancel:hover { background: #ffd1d1; }

        .btn-change { background: #e5f3ff; color: var(--primary-color); }
        .btn-change:hover { background: #cce7ff; }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

<div class="mini-app">
    <div class="header">
        <h2>⚡ 5SIM SMS Activator</h2>
    </div>

    <!-- Balance Card -->
    <div class="balance-card">
        <div>
            <div class="balance-title">Available Balance</div>
            <div class="balance-amount" id="balance-display">$0.00</div>
        </div>
        <button onclick="fetchBalance()" style="width: auto; padding: 6px 10px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 6px; font-size: 12px; cursor: pointer;">🔄 Refresh</button>
    </div>

    <!-- Selection Dropdowns -->
    <div class="form-group">
        <label>1. Country</label>
        <select id="country-select" onchange="onCountryChange()">
            <option value="">Loading Countries...</option>
        </select>
    </div>

    <div class="form-group">
        <label>2. Service</label>
        <select id="service-select" disabled onchange="onServiceChange()">
            <option value="">Select Country First</option>
        </select>
    </div>

    <div class="form-group">
        <label>3. Operator</label>
        <select id="operator-select" disabled>
            <option value="">Select Service First</option>
        </select>
    </div>

    <button id="buy-btn" class="btn-buy" onclick="buyNumber()" disabled>Buy Virtual Number</button>

    <!-- Active Order Output -->
    <div id="order-section" class="order-card" style="display: none;">
        <div class="order-header">
            <span class="order-title">Active Order</span>
            <span id="order-status" class="badge badge-waiting">WAITING</span>
        </div>

        <div class="phone-box" onclick="copyToClipboard(rawPhoneNumber, 'Phone number copied!')">
            <div class="phone-number" id="phone-number">-</div>
            <span class="copy-hint">Tap to copy phone number</span>
        </div>

        <div style="font-size: 11px; color: #777; margin-bottom: 8px;">Order ID: <span id="order-id">-</span></div>

        <!-- SMS Codes List -->
        <div id="sms-container" class="sms-container">
            <div class="loader-text">⏳ Waiting for SMS code...</div>
        </div>

        <!-- Actions -->
        <div class="action-group" id="action-buttons">
            <button class="btn-action btn-cancel" onclick="cancelNumber()">Cancel Order</button>
            <button class="btn-action btn-change" onclick="changeNumber()">Change Number</button>
        </div>
    </div>
</div>

<div id="toast" class="toast">Copied!</div>

<script>
    const BACKEND_URL = "https://underuse-fading-math.ngrok-free.dev";
    const headers = { "ngrok-skip-browser-warning": "69420" };

    let servicesData = [];
    let currentOrderId = null;
    let pollingInterval = null;
    let rawPhoneNumber = "";
    let pollingRetryCount = 0;

    const serviceIcons = {
        'telegram': '✈️', 'whatsapp': '💬', 'steam': '🎮', 'google': '🔍',
        'youtube': '▶️', 'facebook': '📘', 'instagram': '📷', 'twitter': '🐦',
        'x': '🐦', 'tiktok': '🎵', 'discord': '👾', 'openai': '🤖',
        'chatgpt': '🤖', 'netflix': '🎬', 'amazon': '🛒', 'apple': '🍏'
    };

    function getCountryFlag(countryCode) {
        if (!countryCode || countryCode.length !== 2) return '🌐';
        const codePoints = countryCode
            .toUpperCase()
            .split('')
            .map(char => 127397 + char.charCodeAt());
        return String.fromCodePoint(...codePoints);
    }

    function getServiceIcon(serviceName) {
        const name = serviceName.toLowerCase();
        for (const key in serviceIcons) {
            if (name.includes(key)) return serviceIcons[key];
        }
        return '📱';
    }

    function copyToClipboard(text, msg = "Copied!") {
        if (!text || text === "-") return;
        const cleanText = text.trim();
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(cleanText).then(() => showToast(msg));
        } else {
            const textArea = document.createElement("textarea");
            textArea.value = cleanText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast(msg);
        }
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2000);
    }

    async function init() {
        fetchBalance();
        fetchCountries();
    }

    async function fetchBalance() {
        try {
            const res = await fetch(`${BACKEND_URL}/api/profile`, { headers });
            const data = await res.json();
            document.getElementById("balance-display").innerText = data.balance !== undefined ? `$${parseFloat(data.balance).toFixed(4)}` : "$0.00";
        } catch {
            document.getElementById("balance-display").innerText = "Offline";
        }
    }

    async function fetchCountries() {
        const countrySelect = document.getElementById("country-select");
        try {
            const res = await fetch(`${BACKEND_URL}/api/countries`, { headers });
            const countries = await res.json();
            
            countrySelect.innerHTML = '<option value="">-- Choose Country --</option>';
            const sortedKeys = Object.keys(countries).sort();
            
            sortedKeys.forEach(key => {
                const name = countries[key].text || key;
                const flag = countries[key].iso ? getCountryFlag(countries[key].iso) : '🌐';
                const opt = document.createElement("option");
                opt.value = key;
                opt.innerText = `${flag} ${name}`;
                countrySelect.appendChild(opt);
            });
        } catch (e) {
            countrySelect.innerHTML = '<option value="">Failed to load countries</option>';
        }
    }

    async function onCountryChange() {
        const country = document.getElementById("country-select").value;
        const serviceSelect = document.getElementById("service-select");
        const operatorSelect = document.getElementById("operator-select");
        const buyBtn = document.getElementById("buy-btn");

        serviceSelect.disabled = true;
        operatorSelect.disabled = true;
        buyBtn.disabled = true;

        if (!country) return;

        serviceSelect.innerHTML = '<option value="">Loading Services...</option>';

        try {
            const res = await fetch(`${BACKEND_URL}/api/prices/${country}`, { headers });
            const data = await res.json();
            servicesData = data.services || [];

            if (servicesData.length === 0) {
                serviceSelect.innerHTML = '<option value="">No services available</option>';
                return;
            }

            serviceSelect.innerHTML = '<option value="">-- Choose Service --</option>';
            servicesData.forEach(item => {
                const icon = getServiceIcon(item.service);
                const opt = document.createElement("option");
                opt.value = item.service;
                opt.innerText = `${icon} ${item.service.toUpperCase()} ($${item.price_usd} - ${item.count} pcs)`;
                serviceSelect.appendChild(opt);
            });

            serviceSelect.disabled = false;
        } catch {
            serviceSelect.innerHTML = '<option value="">Error loading services</option>';
        }
    }

    function onServiceChange() {
        const selectedService = document.getElementById("service-select").value;
        const operatorSelect = document.getElementById("operator-select");
        const buyBtn = document.getElementById("buy-btn");

        operatorSelect.disabled = true;
        buyBtn.disabled = true;

        if (!selectedService) return;

        const serviceInfo = servicesData.find(s => s.service === selectedService);
        if (!serviceInfo) return;

        operatorSelect.innerHTML = '<option value="any">📶 ANY OPERATOR</option>';
        serviceInfo.operators.forEach(op => {
            if (op.count > 0) {
                const opt = document.createElement("option");
                opt.value = op.operator;
                opt.innerText = `📡 ${op.operator.toUpperCase()} ($${op.cost})`;
                operatorSelect.appendChild(opt);
            }
        });

        operatorSelect.disabled = false;
        buyBtn.disabled = false;
    }

    async function buyNumber() {
        const country = document.getElementById("country-select").value;
        const service = document.getElementById("service-select").value;
        const operator = document.getElementById("operator-select").value || "any";

        document.getElementById("order-section").style.display = "block";
        document.getElementById("action-buttons").style.display = "flex";
        document.getElementById("phone-number").innerText = "Purchasing...";
        document.getElementById("order-id").innerText = "-";
        
        const statusBadge = document.getElementById("order-status");
        statusBadge.innerText = "WAITING";
        statusBadge.className = "badge badge-waiting";

        document.getElementById("sms-container").innerHTML = '<div class="loader-text">⏳ Waiting for SMS code...</div>';

        if (pollingInterval) clearInterval(pollingInterval);
        pollingRetryCount = 0;

        try {
            const res = await fetch(`${BACKEND_URL}/api/buy/${country}/${operator}/${service}`, { headers });
            const data = await res.json();

            if (data.id && data.phone) {
                currentOrderId = data.id;
                rawPhoneNumber = data.phone;
                document.getElementById("phone-number").innerText = data.phone;
                document.getElementById("order-id").innerText = data.id;

                fetchBalance();

                // Start Polling with standard check
                pollingInterval = setInterval(() => checkSMS(data.id), 3000);
            } else {
                alert(data.error || "Failed to buy number!");
                document.getElementById("order-section").style.display = "none";
            }
        } catch (e) {
            alert("Network Error!");
            document.getElementById("order-section").style.display = "none";
        }
    }

    async function checkSMS(orderId) {
        try {
            const res = await fetch(`${BACKEND_URL}/api/check/${orderId}`, { headers });
            const data = await res.json();

            const statusBadge = document.getElementById("order-status");
            const currentStatus = data.status || "WAITING";

            // Safeguard for TIMEOUT on initial calls
            if (currentStatus === "TIMEOUT" && pollingRetryCount < 3) {
                pollingRetryCount++;
                return; // ignore early timeout glitch
            }

            statusBadge.innerText = currentStatus;

            if (currentStatus === "RECEIVED" || (data.sms && data.sms.length > 0)) {
                statusBadge.className = "badge badge-received";
            } else if (currentStatus === "CANCELED" || currentStatus === "TIMEOUT") {
                statusBadge.className = "badge badge-canceled";
            } else {
                statusBadge.className = "badge badge-waiting";
            }

            if (data.sms && data.sms.length > 0) {
                const container = document.getElementById("sms-container");
                let listHtml = '';

                const reversedSMS = [...data.sms].reverse();
                reversedSMS.forEach((smsItem, index) => {
                    const code = smsItem.code || smsItem.code_from_sms || "NO CODE";
                    const text = smsItem.text || smsItem.sender || "";

                    listHtml += `
                        <div class="sms-card">
                            <div class="sms-code" onclick="copyToClipboard('${code}', 'OTP Copied!')">
                                ${code}
                            </div>
                            <div style="font-size:10px; color:#888;">Tap code to copy</div>
                            ${text ? `<div class="sms-text">${text}</div>` : ''}
                        </div>
                    `;
                });

                container.innerHTML = listHtml;
            }

            if (currentStatus === "FINISHED" || currentStatus === "CANCELED" || currentStatus === "TIMEOUT") {
                if (data.sms && data.sms.length === 0) {
                    document.getElementById("sms-container").innerHTML = `<div class="loader-text" style="color:var(--danger-color)">Order ${currentStatus.toLowerCase()}</div>`;
                }
                clearInterval(pollingInterval);
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function cancelNumber() {
        if (!currentOrderId) return;
        try {
            const res = await fetch(`${BACKEND_URL}/api/cancel/${currentOrderId}`, { headers });
            const data = await res.json();

            if (data.status === "CANCELED" || data.id) {
                if (pollingInterval) clearInterval(pollingInterval);
                document.getElementById("order-section").style.display = "none";
                fetchBalance();
            }
        } catch (e) {
            console.error("Cancel failed", e);
        }
    }

    async function changeNumber() {
        if (!currentOrderId) return;
        try {
            await fetch(`${BACKEND_URL}/api/cancel/${currentOrderId}`, { headers });
            if (pollingInterval) clearInterval(pollingInterval);
            await buyNumber();
        } catch (e) {
            console.error("Change failed", e);
        }
    }

    window.onload = init;
</script>

</body>
</html>
